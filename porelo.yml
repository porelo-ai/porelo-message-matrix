# What this repository's whole local build needs: the image a Porelo task on this repository is built from,
# for `./mvnw -s settings.xml -Pnative,dist verify`, the shared checks and `-Pdocuments test`.
# A draft: no Porelo reads this file yet. Tools only, never a rule.
#
# The pins are those the Build takes: the Ubuntu image and the GraalVM from porelo-machines' own pins
# (machines.properties). A move there is not followed here by itself.
# No container starts inside a task's container, so the integration tests run the homeserver's own binary here,
# copied from the image homeserver/Dockerfile pins, by the same digest (TaskImageTest holds them one).
image:
    base_image: "docker.io/library/ubuntu:24.04@sha256:68ee22004a9109b44973313b02ff7b1de250f1de0f5ecb628d73f579aaff33ac"
    snippet: |
        # From Ubuntu: the C toolchain and zlib's headers for native-image, rpm for the .rpm and its checks.
        RUN apt-get update \
            && DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
                build-essential zlib1g-dev ca-certificates curl git unzip rpm \
            && rm -rf /var/lib/apt/lists/*
        RUN curl -fsSL -o /tmp/graalvm.tar.gz \
                https://github.com/graalvm/graalvm-ce-builds/releases/download/graal-25.4.4.1.1/graalvm-community-jdk-25i4-25.0.4.1.1_linux-x64_bin.tar.gz \
            && echo "05ccbbe783210b6886ff7b08fcd0b061c5dce4852b05db87284fc0e24abb08e2  /tmp/graalvm.tar.gz" | sha256sum -c - \
            && mkdir -p /opt/graalvm && tar -xzf /tmp/graalvm.tar.gz -C /opt/graalvm --strip-components=1 \
            && rm /tmp/graalvm.tar.gz \
            && for tool in java javac jar native-image; do ln -s /opt/graalvm/bin/$tool /usr/local/bin/$tool; done
        COPY --from=ghcr.io/matrix-construct/tuwunel:latest@sha256:0e86c6164d6c9f5b60291938eb61ad8395021c37fe58d47a963ea7edddbedaec /usr/bin/tuwunel /usr/local/bin/tuwunel
    env:
        JAVA_HOME: /opt/graalvm
        GRAALVM_HOME: /opt/graalvm
        MATRIX_TEST_TUWUNEL: /usr/local/bin/tuwunel
        # No LANG: Porelo sets LANG=C.UTF-8 in every task and refuses a repository that sets it.
