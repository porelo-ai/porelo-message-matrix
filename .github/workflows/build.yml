name: Build

# A change to documents alone builds nothing: its checks run locally before every hand-over and in the
# Shared rules check once a day; a tag's push is never filtered by path. porelo.yml, the image a Porelo
# task builds this repository in, is no part of the Build either.
# Workflows alone build nothing: an action's move is checked by its pull request, and the next push with
# content builds with it.
on:
    push:
        branches: [main]
        # A release is a tag v<version>, and nothing else.
        tags: ['v*']
        paths-ignore: ['**/*.md', 'doc/**', 'issues/**', 'mkdocs.yml', 'porelo.yml', '.github/**']
    pull_request:
        paths-ignore: ['**/*.md', 'doc/**', 'issues/**', 'mkdocs.yml', 'porelo.yml', '.github/**']

permissions:
    contents: read

# The same file runs on GitHub and on the host's forge; what differs between them is only the values of variables and
# secrets present on both. The snapshot repository Maven reads (settings.xml), and with it the token that reads it.
env:
    MAVEN_SNAPSHOTS_URL: ${{ vars.MAVEN_SNAPSHOTS_URL }}

# A newer push makes the running build's result moot, so it stops rather than spending the minutes.
concurrency:
    group: build-${{ github.ref }}
    cancel-in-progress: true

jobs:
    build:
        runs-on: ubuntu-24.04
        # GitHub's default is six hours, every minute of it paid; a slow runner or a hang stops here instead.
        # About three times a measured run (7.4 min, run 37057573257), with the index check's own wait.
        timeout-minutes: 25
        steps:
            # Every commit, so the push's own range can be read.
            - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
              with:
                  persist-credentials: false
                  fetch-depth: 0

            # A forge with no registry or no token for it would quietly read Sonatype's snapshots alone.
            - name: A forge names its registry and its token
              env:
                  SERVER_URL: ${{ github.server_url }}
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  [ "$SERVER_URL" != 'https://github.com' ] || exit 0
                  [ -n "$MAVEN_SNAPSHOTS_URL" ] || { echo "::error::vars.MAVEN_SNAPSHOTS_URL is empty on $SERVER_URL"; exit 1; }
                  [ -n "$PORELO_PACKAGES_READ_TOKEN" ] || { echo "::error::secrets.PORELO_PACKAGES_READ_TOKEN is empty on $SERVER_URL"; exit 1; }

            # Publishing is switched by a variable present on both forges, true where the packages are published and
            # false where they are not; one missing or misspelt would leave them unpublished without a word.
            - name: Whether this forge publishes
              env:
                  PORELO_PUBLISH: ${{ vars.PORELO_PUBLISH }}
              run: |
                  case "$PORELO_PUBLISH" in
                      true | false) echo "PORELO_PUBLISH=$PORELO_PUBLISH" ;;
                      *) echo "::error::vars.PORELO_PUBLISH is '$PORELO_PUBLISH', neither true nor false"; exit 1 ;;
                  esac

            - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
              with:
                  path: |
                      ~/.m2/repository
                      ~/.m2/wrapper
                  key: maven-${{ hashFiles('pom.xml', '.mvn/wrapper/maven-wrapper.properties') }}
                  restore-keys: maven-

            # rpmbuild for the .rpm, zlib's headers for the native image.
            - name: Install what the packages are built with
              run: sudo apt-get update -qq && sudo apt-get install -y -qq rpm zlib1g-dev

            # The runner's own Java only runs the tools; nothing it compiles is published. JAVA_HOME_25_X64 is
            # the runner's environment, not the workflow's, so it is read by the shell: ${{ env.… }} is empty.
            - name: Resolve the build's tools
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  test -n "${JAVA_HOME_25_X64:-}" || { echo "the runner has no Java 25 (JAVA_HOME_25_X64)"; exit 1; }
                  # -U: the cache is keyed on pom.xml, and a cache from the same day would keep an older snapshot of
                  # the tools - an older check-actions - until the next.
                  JAVA_HOME="$JAVA_HOME_25_X64" ./mvnw -B -ntp -q -U -s settings.xml -Pci-tools dependency:build-classpath \
                      -Dmdep.outputFile="$RUNNER_TEMP/ci-tools.classpath"

            - name: Install the pinned GraalVM
              run: |
                  "$JAVA_HOME_25_X64/bin/java" -cp "$(cat "$RUNNER_TEMP/ci-tools.classpath")" \
                      org.fuin.porelo.machines.Main jdk --github

            - name: Refuse an action that is not pinned
              run: |
                  java -cp "$(cat "$RUNNER_TEMP/ci-tools.classpath")" org.fuin.porelo.release.Main check-actions .github

            # main publishes snapshots and a tag a release; each refuses the other's version, so a release is
            # never a snapshot by mistake and a snapshot never takes a release's number.
            - name: Which channel
              id: channel
              run: |
                  set -euo pipefail
                  version=$(sed -n '/<artifactId>porelo-message-matrix<\/artifactId>/{n;s/.*<version>\(.*\)<\/version>.*/\1/p;}' pom.xml)
                  if [ "${GITHUB_REF_TYPE}" = tag ]; then
                      [ "${GITHUB_REF_NAME}" = "v${version}" ] || { echo "the tag ${GITHUB_REF_NAME} is not v${version}, the pom's version"; exit 1; }
                      case "$version" in *-SNAPSHOT) echo "a tag on a snapshot version: ${version}"; exit 1;; esac
                      echo "channel=releases" >> "$GITHUB_OUTPUT"
                      # In the pom itself, not as -D: the rpm plugin takes the pom's own value over one given there.
                      sed -i -e "s|<deb.version>.*</deb.version>|<deb.version>${version}</deb.version>|" \
                          -e "s|<rpm.release>.*</rpm.release>|<rpm.release>1</rpm.release>|" pom.xml
                      echo "args=" >> "$GITHUB_OUTPUT"
                  else
                      case "$version" in *-SNAPSHOT) ;; *) echo "a branch carries a release version: ${version}"; exit 1;; esac
                      echo "channel=snapshots" >> "$GITHUB_OUTPUT"
                      echo "args=-Dporelo.snapshot.run=${{ github.run_number }} -Dporelo.snapshot.suffix=" >> "$GITHUB_OUTPUT"
                  fi

            # A release depends only on releases: every version in the effective pom - parent, dependencies, the
            # BOM's managed ones, plugins and their dependencies, inactive profiles too - read as Maven resolved it.
            - name: Refuse a snapshot among what a release is built with
              if: github.ref_type == 'tag'
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: |
                  ./mvnw -B -ntp -q -s settings.xml help:effective-pom -Doutput="$RUNNER_TEMP/effective-pom.xml"
                  java -cp "$(cat "$RUNNER_TEMP/ci-tools.classpath")" org.fuin.porelo.release.Main \
                      check-releases "$RUNNER_TEMP/effective-pom.xml" --requires org.fuin.porelo:porelo-release

            # The tests start the homeserver from the image homeserver/Dockerfile pins, with podman. A runner without
            # podman, as the host's forge has, gets that image's binary by the same digest, each manifest and layer
            # checked against its digest, and the tests run it as a task does; the tests that need a container then
            # skip. ghcr.io's pull token is anonymous and still kept off the command line.
            - name: The homeserver where no container starts
              run: |
                  set -euo pipefail
                  if command -v podman > /dev/null; then
                      echo "podman: the tests start the homeserver's image"
                      exit 0
                  fi
                  dir="$RUNNER_TEMP/tuwunel"
                  mkdir -p "$dir"
                  ref=$(sed -n 's|^FROM \(ghcr\.io/[^:@]*\)[^@]*@\(sha256:[0-9a-f]\{64\}\)$|\1 \2|p' homeserver/Dockerfile)
                  read -r image digest <<< "$ref" || true
                  [ -n "${digest:-}" ] || { echo "::error::homeserver/Dockerfile pins no ghcr.io image by digest"; exit 1; }
                  repo=${image#ghcr.io/}
                  token=$(curl -fsSL "https://ghcr.io/token?scope=repository:$repo:pull" | jq -r .token)
                  # The token goes into curl's configuration, where a quote or a line break would add lines of its own.
                  [[ "$token" =~ ^[A-Za-z0-9._~+/=-]+$ ]] || { echo "::error::ghcr.io answered no plain token"; exit 1; }
                  fetch() { # <manifests|blobs> <digest> <file>, kept only when its bytes are that digest
                      [[ "$2" =~ ^sha256:[0-9a-f]{64}$ ]] || { echo "::error::'$2' is no sha256 digest"; exit 1; }
                      printf 'header = "Authorization: Bearer %s"\n' "$token" | curl -fsSL -K - \
                          -H 'Accept: application/vnd.oci.image.index.v1+json, application/vnd.oci.image.manifest.v1+json' \
                          -o "$3" "https://ghcr.io/v2/$repo/$1/$2"
                      echo "${2#sha256:}  $3" | sha256sum -c --quiet - || { echo "::error::$1 $2 is not what was pinned"; exit 1; }
                  }
                  fetch manifests "$digest" "$dir/index.json"
                  manifest=$(jq -r '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64"
                      and .platform.variant == null) | .digest' "$dir/index.json")
                  [ "$(wc -w <<< "$manifest")" = 1 ] || { echo "::error::$image@$digest has no single linux/amd64 image"; exit 1; }
                  fetch manifests "$manifest" "$dir/image.json"
                  # A later layer's copy replaces an earlier one's, as in the image itself.
                  jq -r '.layers[] | .mediaType + " " + .digest' "$dir/image.json" > "$dir/layers"
                  while read -r type layer; do
                      case "$type" in
                          *.tar+zstd) unpack=--zstd ;;
                          *.tar+gzip) unpack=--gzip ;;
                          *) echo "::error::a layer of $image@$digest is $type"; exit 1 ;;
                      esac
                      fetch blobs "$layer" "$dir/layer"
                      # Listed into a file: a pipe into grep -q would end tar early, and pipefail would read that as no match.
                      tar "$unpack" -tf "$dir/layer" > "$dir/listing"
                      if grep -qxF usr/bin/tuwunel "$dir/listing"; then
                          tar "$unpack" -xf "$dir/layer" -C "$dir" usr/bin/tuwunel
                      fi
                  done < "$dir/layers"
                  rm -f "$dir/layer" "$dir/listing"
                  "$dir/usr/bin/tuwunel" --version
                  echo "MATRIX_TEST_TUWUNEL=$dir/usr/bin/tuwunel" >> "$GITHUB_ENV"

            - name: Build, test against the native executable, and package
              timeout-minutes: 20
              env:
                  PORELO_PACKAGES_READ_TOKEN: ${{ secrets.PORELO_PACKAGES_READ_TOKEN }}
              run: ./mvnw -B -ntp -s settings.xml -Pnative verify ${{ steps.channel.outputs.args }}

            # A direct push to main never meets the pull request's check, so the push's own range is read here. A tag
            # checks the commit it names. A new branch or a branch pushed over has no start this checkout holds, so its
            # range starts at main; main itself cannot be pushed over.
            - name: The pushed commits' messages
              if: github.event_name == 'push'
              env:
                  PUSH_BEFORE: ${{ github.event.before }}
              run: |
                  set -eu
                  case "$PUSH_BEFORE" in
                      '') echo "::error::the push names no commit it started from"; exit 1 ;;
                  esac
                  start=$PUSH_BEFORE
                  if [ "$GITHUB_REF_TYPE" = tag ]; then
                      start="$GITHUB_SHA~1"
                  elif ! git cat-file -e "$PUSH_BEFORE^{commit}" 2>/dev/null; then
                      if [ "$GITHUB_REF" = refs/heads/main ]; then
                          echo "::error::main moved from $PUSH_BEFORE, a commit this checkout does not hold"
                          exit 1
                      fi
                      start=origin/main
                  fi
                  java -cp "$(cat "$RUNNER_TEMP/ci-tools.classpath")" org.fuin.porelo.release.Main \
                      check-commits "$start..$GITHUB_SHA"

            - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
              with:
                  name: packages
                  path: |
                      target/*.deb
                      target/rpm/*/RPMS/*/*.rpm
                  if-no-files-found: error

            # Only what main or a release tag builds is published; a pull request's packages stay an artifact.
            # The properties are what put a .deb into the suite's index: without them it is stored, never
            # listed, and nothing says so.
            - name: Publish the packages
              timeout-minutes: 5
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  JF_ACCESS_TOKEN: ${{ secrets.JF_ACCESS_TOKEN }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              # Over Artifactory's REST interface with curl (.github/scripts/artifactory.sh): no client is downloaded into
              # the job that holds the token.
              run: |
                  set -euo pipefail
                  . .github/scripts/artifactory.sh
                  art_login
                  # A release is uploaded once: a version already in the releases index is refused, never replaced.
                  if [ "$CHANNEL" = releases ]; then
                      base="${JF_URL%/}/artifactory"
                      for p in target/*.deb; do
                          if curl -sfL "$base/porelo-dist-deb/dists/releases/main/binary-amd64/Packages" \
                              | grep -qxF "Filename: pool/main/p/$(dpkg-deb -f "$p" Package)/$(basename "$p")"; then
                              echo "$(basename "$p") is released already"; exit 1
                          fi
                      done
                  fi
                  for p in target/*.deb; do
                      name=$(dpkg-deb -f "$p" Package); arch=$(dpkg-deb -f "$p" Architecture)
                      art_put "$p" "porelo-dist-deb/pool/main/p/$name/" \
                          "deb.distribution=${CHANNEL};deb.component=main;deb.architecture=$arch"
                  done
                  for p in target/rpm/*/RPMS/*/*.rpm; do
                      art_put "$p" "porelo-dist-rpm/${CHANNEL}/"
                  done

            # Artifactory indexes after the upload, by itself and without a word when it fails, so the index is
            # read back, as a machine installing from it reads it, until it names the very files just uploaded.
            # Measured: over three minutes from the upload to the .deb index.
            - name: The packages are indexed, not merely stored
              timeout-minutes: 12
              if: vars.PORELO_PUBLISH == 'true' && github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref_type == 'tag')
              env:
                  JF_URL: ${{ vars.JF_URL }}
                  CHANNEL: ${{ steps.channel.outputs.channel }}
              run: |
                  set -euo pipefail
                  base="${JF_URL%/}/artifactory"
                  missing() {
                      curl -sfL "$base/porelo-dist-deb/dists/${CHANNEL}/main/binary-amd64/Packages" > "$RUNNER_TEMP/Packages" \
                          || : > "$RUNNER_TEMP/Packages"
                      for p in target/*.deb; do
                          grep -qxF "Filename: pool/main/p/$(dpkg-deb -f "$p" Package)/$(basename "$p")" "$RUNNER_TEMP/Packages" \
                              || echo "porelo-dist-deb: $(basename "$p")"
                      done
                      primary=$(curl -sfL "$base/porelo-dist-rpm/${CHANNEL}/repodata/repomd.xml" \
                          | grep -o 'href="repodata/[^"]*primary\.xml\.gz"' | cut -d'"' -f2 || true)
                      { [ -n "$primary" ] && curl -sfL "$base/porelo-dist-rpm/${CHANNEL}/$primary" | gunzip; } > "$RUNNER_TEMP/primary.xml" \
                          || : > "$RUNNER_TEMP/primary.xml"
                      for p in target/rpm/*/RPMS/*/*.rpm; do
                          grep -qF "$(basename "$p")\"" "$RUNNER_TEMP/primary.xml" || echo "porelo-dist-rpm: $(basename "$p")"
                      done
                  }
                  for i in $(seq 60); do
                      left=$(missing)
                      [ -z "$left" ] && { echo "indexed after about $(( (i - 1) * 10 )) s"; exit 0; }
                      sleep 10
                  done
                  echo "uploaded, but not in the ${CHANNEL} index after ten minutes:"
                  echo "$left"
                  exit 1
