version: 2
updates:
    # Every action is pinned to a commit; this moves only those pins. The homeserver's image is moved by hand.
    - package-ecosystem: github-actions
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: "Move the pinned"
