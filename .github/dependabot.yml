version: 2
updates:
    # Every action is pinned to a commit; this is what moves the pins, and a person reviews each move.
    - package-ecosystem: github-actions
      directories:
          - "/"
          - "/.github/actions/*"
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          actions:
              patterns: ["*"]
      commit-message:
          prefix: "Move the pinned"
    # The homeserver's image digest, in the one place it is pinned.
    - package-ecosystem: docker
      directory: /homeserver
      schedule:
          interval: weekly
      cooldown:
          default-days: 3
      groups:
          homeserver:
              patterns: ["*"]
      commit-message:
          prefix: "Move the pinned"
